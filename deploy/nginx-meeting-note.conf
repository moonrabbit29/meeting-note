server {
    listen 80;
    server_name 103.146.203.218;

    # Logging
    access_log /var/log/nginx/meeting-note-access.log;
    error_log /var/log/nginx/meeting-note-error.log;

    # Client upload size (adjust if needed for large files)
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3000;

        # Critical headers for SvelteKit CSRF to work
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
